name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Debug keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ls -la "$RUNNER_TEMP/release.jks"
          md5sum "$RUNNER_TEMP/release.jks"
          echo "alias length: ${#KEY_ALIAS}"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" | head -20
      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Print signer digests
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for apk in \
            dpc/build/outputs/apk/release/dpc-release.apk \
            hide/build/outputs/apk/release/hide-release.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "sha-256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            dpc/build/outputs/apk/release/dpc-release.apk
            hide/build/outputs/apk/release/hide-release.apk
